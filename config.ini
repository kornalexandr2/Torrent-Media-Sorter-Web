; ==============================================================================
; НАСТРОЙКИ TRANSMISSION MEDIA SORTER
; ==============================================================================
; Перед использованием переименуйте этот файл (если требуется) и заполните данные.
; Комментарии начинаются с символа ";"
; ==============================================================================

[PATHS]
; ------------------------------------------------------------------------------
; Пути к папкам назначения
; ------------------------------------------------------------------------------
; Сюда скрипт будет перемещать скачанные файлы после обработки.
; Убедитесь, что у пользователя, запускающего скрипт (обычно 'debian-transmission'),
; есть права на ЗАПИСЬ в эти папки.
;
; Примеры для Linux:
; movies_folder = /mnt/media/movies
; series_folder = /mnt/media/tvshows
;
; Примеры для Windows:
; movies_folder = C:\Media\Movies
; series_folder = D:\TVShows

movies_folder = /change/me/to/movies/path
series_folder = /change/me/to/tvshows/path

[LOGGING]
; ------------------------------------------------------------------------------
; Настройки журналирования (логов)
; ------------------------------------------------------------------------------
; level: Уровень детализации логов.
;   INFO    - Стандартный режим (запуск, результат, ошибки).
;   DEBUG   - Максимальная детализация (ответы API, каждое действие). Используйте для отладки.
;   WARNING - Только предупреждения и критические ошибки.
level = INFO

; log_file: Полный путь к файлу, куда будет писаться история работы.
; Убедитесь, что папка существует и доступна для записи.
log_file = /opt/mediasorter/sorter.log

[SYSTEM]
; ------------------------------------------------------------------------------
; Системные настройки
; ------------------------------------------------------------------------------
; video_extensions: Список расширений файлов, которые скрипт считает видео.
; Файлы с другими расширениями (например, .txt, .nfo, .jpg) будут игнорироваться
; при копировании (если это не папка).
video_extensions = .mkv,.avi,.mp4,.mov,.wmv,.m4v,.ts

[RENAMING]
; ------------------------------------------------------------------------------
; Настройки переименования файлов
; ------------------------------------------------------------------------------
; rename_mode: Какой язык использовать для названия файла/папки?
;   ru        - Русское название с Кинопоиска/TMDB (Например: "Интерстеллар").
;   en        - Английское название (Например: "Interstellar").
;   origin    - Оригинальное название (как в источнике данных).
;   no_change - Не менять название вообще (оставить как в торренте).
; Если название на выбранном языке не найдено, скрипт попробует другие варианты.
rename_mode = ru

; save_original_filename: Сохранять ли оригинальное имя файла в скобках?
; Это полезно для сохранения информации о релиз-группе, качестве и звуке.
;   True  -> "Интерстеллар (Interstellar.2014.1080p.BluRay.x264).mkv"
;   False -> "Интерстеллар.mkv"
save_original_filename = True

[SEARCH]
; ------------------------------------------------------------------------------
; Настройки поиска и очистки названий
; ------------------------------------------------------------------------------
; См. также файл stop_words.txt для редактирования списка исключаемых слов.

[API]
; ------------------------------------------------------------------------------
; Источники данных (API)
; ------------------------------------------------------------------------------
; Скрипт использует каскадный поиск: Kinopoisk -> TMDB -> TVDB.
; Вы можете включить (True) или выключить (False) любой из них.
; Для работы требуются API ключи (большинство можно получить бесплатно).

; --- Kinopoisk Unofficial ---
; Получить ключ: https://kinopoiskapiunofficial.tech
use_kp = True
kp_api_key = YOUR_KINOPOISK_API_KEY

; --- The Movie Database (TMDB) ---
; Получить ключ: https://www.themoviedb.org/settings/api
use_tmdb = True
tmdb_api_key = YOUR_TMDB_API_KEY

; --- The TV Database (TVDB v4) ---
; Получить ключ: https://thetvdb.com/api-information
use_tvdb = False
tvdb_api_key = YOUR_TVDB_API_KEY

[TELEGRAM]
; ------------------------------------------------------------------------------
; Уведомления в Telegram
; ------------------------------------------------------------------------------
; Отправляет сообщение при успешной обработке или критической ошибке.
; use_telegram: Включить (True) или выключить (False).
use_telegram = False

; bot_token: Токен бота, полученный от @BotFather.
bot_token = YOUR_TELEGRAM_BOT_TOKEN

; chat_id: Ваш ID или ID группы. Можно узнать у бота @userinfobot.
chat_id = YOUR_TELEGRAM_CHAT_ID

[TRANSMISSION]
; ------------------------------------------------------------------------------
; Взаимодействие с торрент-клиентом
; ------------------------------------------------------------------------------
; Эти настройки нужны для того, чтобы скрипт мог удалить торрент из списка
; загрузок Transmission после успешной сортировки.

; Адрес и порт веб-интерфейса Transmission (обычно localhost и 9091)
host = localhost
port = 9091

; Если в Transmission включена авторизация, укажите данные ниже.
; Если нет - оставьте пустыми.
username = 
password =