<div id="modal-container" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
        <div class="px-6 py-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
            <h3 class="font-bold text-gray-800">🛠 Fix Match</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">&times;</button>
        </div>
        <form hx-post="/fix-match/{{ download.id }}" hx-target="body" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Media Type</label>
                <select name="media_type" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                    <option value="movie" {% if download.media_type == 'MOVIE' %}selected{% endif %}>Movie</option>
                    <option value="tv" {% if download.media_type == 'SERIES' %}selected{% endif %}>Series</option>
                    <option value="game" {% if download.media_type == 'GAME' %}selected{% endif %}>Game</option>
                    <option value="software" {% if download.media_type == 'SOFTWARE' %}selected{% endif %}>Software</option>
                    <option value="other" {% if download.media_type == 'OTHER' %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Source Provider</label>
                <select name="source" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                    <option value="kp">Kinopoisk (KP)</option>
                    <option value="tmdb">TMDB</option>
                    <option value="tvdb">TVDB</option>
                    <option value="none">Manual (No Metadata)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Source ID / Name (Optional for Manual)</label>
                <input type="text" name="source_id" value="{{ download.source_id or '' }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            </div>
            <div class="flex justify-end gap-3 pt-4">
                <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg font-bold">Cancel</button>
                <button type="submit" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold">Apply & Retry</button>
            </div>
        </form>
    </div>
</div>
