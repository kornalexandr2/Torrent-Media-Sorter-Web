<div id="modal-container" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
        <div class="px-6 py-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
            <h3 class="font-bold text-gray-800">🛠 {{ _("fix_match") }}</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">&times;</button>
        </div>
        <div class="px-6 py-3 bg-blue-50 border-b border-blue-100">
            <p class="text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-1">Оригинальный путь</p>
            <p class="text-xs font-mono text-blue-800 break-all">{{ download.original_path }}</p>
        </div>
        <form hx-post="/fix-match/{{ download.id }}" hx-swap="none" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">{{ _("media_type") }}</label>
                <select id="media_type_select" name="media_type" onchange="filterProviders()" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                    <option value="movie" {% if download.media_type == 'MOVIE' %}selected{% endif %}>{{ _("movie") }}</option>
                    <option value="tv" {% if download.media_type == 'SERIES' %}selected{% endif %}>{{ _("tv") }}</option>
                    <option value="game" {% if download.media_type == 'GAME' %}selected{% endif %}>{{ _("game") }}</option>
                    <option value="software" {% if download.media_type == 'SOFTWARE' %}selected{% endif %}>{{ _("software") }}</option>
                    <option value="other" {% if download.media_type == 'OTHER' %}selected{% endif %}>{{ _("other") }}</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">{{ _("source_provider") }}</label>
                <select id="source_provider_select" name="source" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                    <option value="kp" data-types="movie,tv">Kinopoisk (KP)</option>
                    <option value="tmdb" data-types="movie,tv">TMDB</option>
                    <option value="tvdb" data-types="movie,tv">TVDB</option>
                    <option value="igdb" data-types="game,software">IGDB (Games)</option>
                    <option value="none" data-types="movie,tv,game,software,other">{{ _("manual_no_meta") }}</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">{{ _("source_id_name_hint") }}</label>
                <input type="text" name="source_id" value="{{ download.source_id or '' }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            </div>
            <div class="flex justify-end gap-3 pt-4">
                <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg font-bold">{{ _("cancel") }}</button>
                <button type="submit" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold">{{ _("apply_retry") }}</button>
            </div>
        </form>
    </div>
</div>

<script>
    function filterProviders() {
        const typeSelect = document.getElementById('media_type_select');
        const providerSelect = document.getElementById('source_provider_select');
        const selectedType = typeSelect.value;
        
        let firstVisible = null;
        let currentSelectedStillVisible = false;

        Array.from(providerSelect.options).forEach(option => {
            const allowedTypes = option.getAttribute('data-types').split(',');
            if (allowedTypes.includes(selectedType)) {
                option.style.display = '';
                option.disabled = false;
                if (!firstVisible) firstVisible = option;
                if (option.selected) currentSelectedStillVisible = true;
            } else {
                option.style.display = 'none';
                option.disabled = true;
                if (option.selected) option.selected = false;
            }
        });

        if (!currentSelectedStillVisible && firstVisible) {
            firstVisible.selected = true;
        }
    }
    
    // Initial call to set correct state
    filterProviders();
</script>
