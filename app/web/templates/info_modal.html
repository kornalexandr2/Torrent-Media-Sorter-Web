<div id="modal-backdrop" 
     style="position: fixed; inset: 0; background-color: rgba(0,0,0,0.8); z-index: 99999; display: flex; align-items: center; justify-center: center; padding: 20px; backdrop-filter: blur(4px);">
    
    <div style="background: white; border-radius: 16px; width: 100%; max-width: 800px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); position: relative;">
        
        <!-- Header -->
        <div style="padding: 16px 24px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 24px;">ℹ️</span>
                <div>
                    <h3 style="margin: 0; font-weight: 800; color: #1e293b; font-family: sans-serif;">Информация об объекте</h3>
                    <p style="margin: 0; font-size: 12px; color: #64748b; font-family: monospace;">{{ download.torrent_name }}</p>
                </div>
            </div>
            <button onclick="document.getElementById('modal-backdrop').remove()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #94a3b8;">&times;</button>
        </div>

        <!-- Body -->
        <div style="padding: 24px; overflow-y: auto; flex: 1; font-family: sans-serif;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
                <div>
                    <label style="font-size: 10px; text-transform: uppercase; font-weight: bold; color: #94a3b8;">Статус</label>
                    <div style="margin-top: 4px;">
                        <span style="padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: bold; background: #dcfce7; color: #166534;">{{ download.status }}</span>
                    </div>
                </div>
                <div>
                    <label style="font-size: 10px; text-transform: uppercase; font-weight: bold; color: #94a3b8;">Тип</label>
                    <p style="margin: 4px 0 0 0; font-size: 14px; color: #334155;">{{ download.media_type }}</p>
                </div>
            </div>

            <div style="margin-bottom: 24px;">
                <label style="font-size: 10px; text-transform: uppercase; font-weight: bold; color: #94a3b8;">Оригинальный путь</label>
                <div style="background: #f1f5f9; padding: 12px; border-radius: 8px; font-size: 11px; font-family: monospace; color: #475569; word-break: break-all; margin-top: 4px;">
                    {{ download.original_path }}
                </div>
            </div>

            {% if download.logs %}
            <div>
                <label style="font-size: 10px; text-transform: uppercase; font-weight: bold; color: #94a3b8;">История логов</label>
                <div style="background: #0f172a; color: #4ade80; padding: 16px; border-radius: 12px; font-family: monospace; font-size: 11px; margin-top: 8px; white-space: pre-wrap; max-height: 200px; overflow-y: auto;">
                    {{ download.logs }}
                </div>
            </div>
            {% endif %}
        </div>

        <!-- Footer -->
        <div style="padding: 16px 24px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 12px;">
            <button onclick="document.getElementById('modal-backdrop').remove()" style="padding: 10px 20px; background: white; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: bold; cursor: pointer; color: #475569;">Закрыть</button>
        </div>
    </div>
    
    <script>
        console.log('!!! MODAL HTML RENDERED AND SCRIPT EXECUTED !!!');
        // Принудительно перемещаем в начало body для надежности
        document.body.prepend(document.getElementById('modal-backdrop'));
    </script>
</div>
