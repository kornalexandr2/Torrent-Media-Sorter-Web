{% extends "layout.html" %}

{% block title %}Dashboard - Torrent Media Sorter{% endblock %}

{% block content %}
<div class="mb-8 flex justify-between items-center">
    <h1 class="text-3xl font-bold text-gray-800">Dashboard</h1>
    <div class="flex gap-3">
        <button hx-get="/scan" 
                hx-target="#modal-placeholder" 
                hx-swap="innerHTML"
                class="inline-flex items-center justify-center px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl transition-all shadow-sm active:scale-95 cursor-pointer">
            <span class="mr-2 pointer-events-none">📂</span> Сканировать
        </button>
        
        <button hx-post="/refresh" 
                hx-target="body" 
                class="relative inline-flex items-center justify-center px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-xl transition-all shadow-sm active:scale-95 min-w-[160px] cursor-pointer"
                hx-indicator="#refresh-indicator">
            <span class="htmx-indicator-hide flex items-center pointer-events-none">
                <span class="mr-2">🔄</span> Синхронизировать
            </span>
            <div id="refresh-indicator" class="htmx-indicator absolute inset-0 flex items-center justify-center bg-inherit rounded-xl">
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </button>
    </div>
</div>

<div id="downloads-container">
    
    <div id="downloads-table-wrapper" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 text-gray-600 text-sm uppercase font-semibold">
                    <tr>
                        <th class="px-6 py-4 w-48 text-left">Created At</th>
                        <th class="px-6 py-4 text-left">Torrent Name</th>
                        <th class="px-6 py-4 text-left">Detected As</th>
                        <th class="px-6 py-4 w-40 text-left">Status</th>
                        <th class="px-6 py-4 w-56 text-left">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 text-gray-700">
                    {% for d in downloads %}
                        {% include "download_row.html" %}
                    {% else %}
                    <tr>
                        <td colspan="5" class="px-6 py-12 text-center text-gray-400">
                            No downloads found.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Скрытый воркер для обновления статусов через OOB Swap -->
<div hx-get="/api/status-updates" 
     hx-trigger="every 10s" 
     hx-swap="none" 
     style="display:none"></div>

{% endblock %}
