<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Torrent Media Sorter{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('HTMX Initialized. Version:', htmx.version);
        });

        document.addEventListener('htmx:beforeRequest', function(evt) {
            console.log('HTMX Request Started:', evt.detail.path);
        });
        
        document.addEventListener('htmx:afterOnLoad', function(evt) {
            console.log('HTMX Response Received. Status:', evt.detail.xhr.status);
        });

        document.addEventListener('htmx:beforeSwap', function(evt) {
            console.log('HTMX Preparing to swap content into:', evt.detail.target.id);
        });

        document.addEventListener('htmx:afterSwap', function(evt) {
            console.log('HTMX Swap Complete. Content length in target:', evt.detail.target.innerHTML.length);
            if (evt.detail.target.id === 'modal-root' && evt.detail.target.innerHTML.length > 0) {
                console.log('MODAL SHOULD BE VISIBLE NOW');
            }
        });

        document.addEventListener('htmx:load', function(evt) {
            console.log('HTMX Node Loaded/Processed:', evt.detail.elt.id || evt.detail.elt.tagName);
        });
    </script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: flex; }
        .htmx-request.htmx-indicator { display: flex; }
        .htmx-request .htmx-indicator-hide { opacity: 0; }
        
        /* Важно: не используем display: none для родителя модалки */
        #modal-root {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 9999;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-slate-800 text-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-xl font-bold flex items-center gap-2">
                <span>📦</span> Torrent Media Sorter
            </a>
            <div class="flex items-center gap-6">
                <a href="/" class="hover:text-blue-400 text-sm font-semibold transition">Dashboard</a>
                <a href="/settings" class="hover:text-blue-400 text-sm font-semibold transition">Settings</a>
                <a href="/logs" class="hover:text-blue-400 text-sm font-semibold transition">Logs</a>
                
                {% if user %}
                <div class="h-6 w-px bg-slate-700"></div>
                <div class="flex items-center gap-3">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">{{ user.username }}</span>
                    <a href="/logout" class="p-2 hover:bg-slate-700 rounded-lg text-slate-300 hover:text-white transition group" title="Выход">
                        <svg class="w-5 h-5 group-hover:scale-110 transition duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </a>
                </div>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-8 text-gray-500 text-sm">
        Torrent Media Sorter Web &copy; 2026
    </footer>

    <!-- Контейнер для модальных окон в самом конце body -->
    <div id="modal-root"></div>
</body>
</html>
