<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Torrent Media Sorter{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: flex; }
        .htmx-request.htmx-indicator { display: flex; }
        .htmx-request .htmx-indicator-hide { opacity: 0; }

        /* Modal management */
        body.modal-open { overflow: hidden; }
        #modal-container { 
            animation: fadeIn 0.2s ease-out;
            position: fixed;
            inset: 0;
            z-index: 9999;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* Важно: modal-placeholder должен позволять контенту быть позиционированным fixed */
        #modal-placeholder { 
            position: static;
            min-height: 0;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-slate-800 text-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-xl font-bold flex items-center gap-2">
                <span>📦</span> Torrent Media Sorter
            </a>
            <div class="flex items-center gap-6">
                <a href="/" class="hover:text-blue-400 text-sm font-semibold transition">Dashboard</a>
                <a href="/settings" class="hover:text-blue-400 text-sm font-semibold transition">Settings</a>
                <a href="/logs" class="hover:text-blue-400 text-sm font-semibold transition">Logs</a>
                
                {% if user %}
                <div class="h-6 w-px bg-slate-700"></div>
                <div class="flex items-center gap-3">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">{{ user.username }}</span>
                    <a href="/logout" class="p-2 hover:bg-slate-700 rounded-lg text-slate-300 hover:text-white transition group" title="Выход">
                        <svg class="w-5 h-5 group-hover:scale-110 transition duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </a>
                </div>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-8 text-gray-500 text-sm">
        Torrent Media Sorter Web &copy; 2026
    </footer>

    <div id="modal-placeholder"></div>

    <script>
        function closeModal() {
            const modal = document.getElementById('modal-container');
            if (modal) {
                modal.remove();
                document.body.classList.remove('modal-open');
            }
        }

        // Отладка HTMX событий
        document.body.addEventListener('htmx:beforeRequest', function(event) {
            console.log('[HTMX] beforeRequest:', event.detail.elt.id, '->', event.detail.requestConfig.path);
            
            // Защита от автообновления, если открыто модальное окно
            if (document.getElementById('modal-container')) {
                if (event.detail.elt.id === 'downloads-container') {
                    event.preventDefault();
                    console.log('[HTMX] Skipping auto-refresh - modal is open');
                }
            }
        });
        
        document.body.addEventListener('htmx:afterSwap', function(event) {
            console.log('[HTMX] afterSwap target:', event.detail.target.id);
            console.log('[HTMX] response status:', event.detail.xhr.status);
            console.log('[HTMX] response text length:', event.detail.xhr.responseText ? event.detail.xhr.responseText.length : 0);
            if (event.detail.xhr.status !== 200) {
                console.error('[HTMX] Non-200 response received!');
            }
        });
        
        document.body.addEventListener('htmx:afterSettle', function(event) {
            console.log('[HTMX] afterSettle:', event.detail.target.id);
            if (event.detail.target.id === 'modal-placeholder') {
                // Проверяем содержимое modal-placeholder
                console.log('[MODAL] modal-placeholder.innerHTML:', document.getElementById('modal-placeholder')?.innerHTML.substring(0, 200));
                
                // Увеличенная задержка для гарантии рендеринга
                setTimeout(function() {
                    const modal = document.getElementById('modal-container');
                    if (modal) {
                        console.log('[MODAL] Modal found, adding modal-open class');
                        document.body.classList.add('modal-open');
                    } else {
                        console.warn('[MODAL] Modal not found in DOM');
                        console.log('[MODAL] modal-placeholder children:', document.getElementById('modal-placeholder')?.children);
                    }
                }, 200);
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
